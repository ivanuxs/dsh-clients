<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DSH clients">
  <!--
    Variante "maskable" del icono: mismo dibujo, fondo a sangre (sin esquinas
    redondeadas) y el glifo al 62 %, para que quepa en la zona segura de Android
    cuando el lanzador recorta en circulo o en gota.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3A66"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#fondo)"/>

  <g transform="translate(84.9 86.1) scale(0.62)">
    <!-- Ventana de terminal -->
    <rect x="88" y="104" width="336" height="232" rx="26" fill="#0B1424" stroke="#2A4368" stroke-width="8"/>
    <line x1="96" y1="160" x2="416" y2="160" stroke="#2A4368" stroke-width="8"/>
    <circle cx="126" cy="132" r="9" fill="#F87171"/>
    <circle cx="162" cy="132" r="9" fill="#FBBF24"/>
    <circle cx="198" cy="132" r="9" fill="#34D399"/>

    <!-- Simbolo de peticion y cursor -->
    <path d="M148 200 L188 232 L148 264" fill="none" stroke="#7DD3FC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="214" y="248" width="64" height="16" rx="8" fill="#7DD3FC"/>

    <!-- Burbuja de conversacion, con su cola -->
    <rect x="292" y="292" width="172" height="108" rx="28" fill="#22D3EE"/>
    <path d="M330 392 L330 444 L378 392 Z" fill="#22D3EE"/>
    <circle cx="336" cy="346" r="10" fill="#0B1424"/>
    <circle cx="378" cy="346" r="10" fill="#0B1424"/>
    <circle cx="420" cy="346" r="10" fill="#0B1424"/>
  </g>
</svg>
